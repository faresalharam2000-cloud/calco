<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام حسابات الشركة - سحابي</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1b2430;--muted:#6b7688;--line:#e3e8f0;--primary:#1f6feb;--primary-d:#1558c4;--ok:#0f9d58;--warn:#e8a33d;--danger:#e5484d;--radius:14px}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
h1,h2,h3{margin:0 0 12px}
h3{font-size:16px}
.muted{color:var(--muted)}
.small{font-size:12px}
.hint{background:#eef4ff;border:1px solid #d6e4ff;color:#204e9a;padding:10px 12px;border-radius:10px;font-size:13px;margin-top:14px}
.hidden{display:none!important}
.mt{margin-top:14px}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;width:100%;max-width:420px;box-shadow:0 10px 30px rgba(20,40,80,.08)}
.auth-card.wide{max-width:780px}
.auth-card h1{font-size:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
input,select,button{font-family:inherit;font-size:14px}
input,select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);outline:none;width:100%}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,111,235,.12)}
input:disabled{background:#f1f3f7;color:#8b95a6}
.btn{padding:10px 16px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;font-weight:700;color:var(--ink);transition:.15s}
.btn:hover{background:#f6f8fc}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-d)}
.btn.ghost{background:transparent}
.btn.danger{background:#fdeaea;border-color:#f5c6c7;color:#b4262b}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.msg{font-size:13px;margin-top:10px;min-height:18px}
.msg.err{color:var(--danger)}
.msg.ok{color:var(--ok)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.branch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.branch-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 12px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;cursor:pointer;transition:.15s;text-align:center;font-family:inherit;position:relative}
.branch-card:hover{border-color:var(--primary);box-shadow:0 6px 18px rgba(31,111,235,.12);transform:translateY(-2px)}
.branch-icon{font-size:26px}
.branch-name{font-weight:800;color:var(--ink)}
.del-branch-btn{position:absolute;top:8px;right:8px;color:var(--danger);background:none;border:none;cursor:pointer;font-size:16px;padding:4px;}
.tabs{display:flex;gap:6px;background:#eef1f7;padding:5px;border-radius:12px;margin-bottom:16px}
.tab{flex:1;padding:9px;border:0;background:transparent;border-radius:9px;cursor:pointer;font-weight:700;color:var(--muted)}
.tab.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(20,40,80,.08)}
.app-tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:5}
.app-tabs .tab{flex:0 0 auto;padding:9px 16px;white-space:nowrap}
.app-header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;flex-wrap:wrap}
.brand{font-weight:900;font-size:16px;color:var(--primary)}
.ctx{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{background:#eef1f7;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:#4a566b}
.chip.strong{background:#e3edff;color:var(--primary-d)}
.chip.user{background:#e9f7ef;color:#0b7a45}
.view{padding:18px;max-width:1200px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,40,80,.04)}
.grid{display:grid;gap:14px;margin-bottom:16px}
.grid.cards{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.grid.two .card{margin-bottom:0}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.stat-label{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:8px}
.stat-value{font-size:20px;font-weight:900}
.stat.primary .stat-value{color:var(--primary)}
.stat.warn .stat-value{color:var(--warn)}
.stat.ok .stat-value{color:var(--ok)}
.stat.bank .stat-value{color:#6b3fd4}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.span2{grid-column:1/-1}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.tbl th{background:#f8fafd;font-size:12px;color:var(--muted);font-weight:800;white-space:nowrap}
.tbl td.num,.tbl th.num{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr:hover td{background:#fbfcfe}
.tbl tfoot td{font-weight:900;background:#f8fafd}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800}
.badge.blue{background:#e3edff;color:#1558c4}
.badge.purple{background:#f0e8ff;color:#6b3fd4}
.badge.red{background:#fdeaea;color:#b4262b}
.badge.green{background:#e9f7ef;color:#0b7a45}
.badge.orange{background:#fff2e0;color:#a86400}
.badge.gray{background:#eef1f7;color:#4a566b}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:#1b2430;color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;font-size:13px;opacity:0;transition:.25s;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--danger)}
.toast.ok{background:var(--ok)}
#error-overlay{display:none;position:fixed;inset:0;background:#fff;z-index:99999;padding:24px;overflow:auto;font-family:monospace}
#error-overlay h2{color:#c00}
#error-msg{background:#fee;padding:16px;border-radius:10px;white-space:pre-wrap;word-break:break-word;font-size:13px;color:#900;border:1px solid #f5c6c7}
#error-overlay button{padding:10px 20px;font-size:15px;cursor:pointer;margin-left:10px;border-radius:8px;border:1px solid #ccc;background:#f6f8fc}

/* أنماط الطباعة */
.print-only{display:none;}
@media print{
  body{background:#fff;font-size:12px;}
  .app-header,.app-tabs,.btn,.no-print,.tabs{display:none!important;}
  .card{box-shadow:none;border:none;padding:0;margin-bottom:20px;}
  .view{padding:0;max-width:100%;}
  .print-only{display:block !important;text-align:center;margin-bottom:20px;border-bottom:2px solid #000;padding-bottom:10px;}
  .tbl th{background:#f0f0f0 !important;-webkit-print-color-adjust:exact;color:#000;}
  .tbl th,.tbl td{border:1px solid #ddd;}
  .grid.cards{display:block;}
  .stat{border:none;padding:5px 0;display:flex;justify-content:space-between;border-bottom:1px dashed #ccc;}
  .stat-value{font-size:16px;}
}
/* شاشة التحميل */
#loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;color:var(--primary);font-weight:900;font-size:20px;}
.spinner{width:50px;height:50px;border:5px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="loading-screen">
  <div class="spinner"></div>
  جاري الاتصال بقاعدة البيانات السحابية...
</div>

<div id="error-overlay">
  <h2>⚠️ حدث خطأ</h2>
  <pre id="error-msg"></pre>
  <div style="margin-top:20px">
    <button onclick="location.reload()">إعادة تحميل</button>
  </div>
</div>

<div id="app-root"></div>

<script>
(function(){
"use strict";

function showError(msg){
  var ov = document.getElementById('error-overlay');
  var box = document.getElementById('error-msg');
  if(ov && box){ ov.style.display='block'; box.textContent = msg; }
}
window.addEventListener('error', function(e){ showError((e.message||'') + '\n' + ((e.error && e.error.stack) || '')); });

try {
var SKEY = 'accsys_session';
var db = { companies:[], branches:[], users:[], contacts:[], sales:[], purchases:[], expenses:[], payments:[], auditLogs: [] };
var session = loadSession();
var ui = { tab:'dashboard', dailyDate: today(), rType:'weekly', rDate:today(), rStart:today(), rEnd:today(), rMonth:today().slice(0,7) };

function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }

function loadSession(){
  try{ var s = JSON.parse(sessionStorage.getItem(SKEY)||'null'); if(s && s.companyId && s.branchId && s.userId) return s; }catch(e){}
  return { companyId:null, branchId:null, userId:null };
}
function saveSession(){ try{ sessionStorage.setItem(SKEY, JSON.stringify(session)); }catch(e){} }
function resetSession(){ session = { companyId:null, branchId:null, userId:null }; saveSession(); }

var root = document.getElementById('app-root');
function $(s){ return document.querySelector(s); }

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(m){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]; }); }
function num(n){ return Number(n||0); }
function sum(arr, key){ return arr.reduce(function(a,x){ return a + num(x[key]); }, 0); }
function isoLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function today(){ return isoLocal(new Date()); }
function money(n){
  var c = db.companies.find(function(x){ return x.id===session.companyId; });
  var cur = (c && c.currency) || 'ر.س';
  return num(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ' + cur;
}
function toast(msg, type){
  var t = document.createElement('div'); t.className = 'toast ' + (type||'ok'); t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(function(){ t.classList.add('show'); });
  setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },300); }, 2400);
}
function flash(msg, type){ var el = $('#msg'); if(el){ el.textContent = msg; el.className = 'msg ' + (type||'err'); } }
function stat(label, value, cls){ return '<div class="stat '+(cls||'')+'"><div class="stat-label">'+label+'</div><div class="stat-value">'+value+'</div></div>'; }

async function loadDBFromCloud() {
  try {
    const res = await fetch('/api/data');
    if (!res.ok) throw new Error('فشل الاتصال بالخادم');
    const cloudDb = await res.json();
    
    db.companies = cloudDb.companies.map(c => ({...c, cashOpening: c.cash_opening, bankOpening: c.bank_opening}));
    db.branches = cloudDb.branches.map(b => ({...b, companyId: b.company_id, cashOpening: b.cash_opening, bankOpening: b.bank_opening}));
    db.users = cloudDb.users.map(u => ({...u, companyId: u.company_id, branchId: u.branch_id}));
    db.contacts = cloudDb.contacts.map(c => ({...c, companyId: c.company_id, branchId: c.branch_id}));
    db.sales = cloudDb.sales.map(s => ({...s, branchId: s.branch_id, customerId: s.customer_id, customerName: s.customer_name}));
    db.purchases = cloudDb.purchases.map(p => ({...p, branchId: p.branch_id, supplierId: p.supplier_id, supplierName: p.supplier_name}));
    db.expenses = cloudDb.expenses.map(e => ({...e, branchId: e.branch_id}));
    db.payments = cloudDb.payments.map(p => ({...p, branchId: p.branch_id, partyId: p.party_id, partyType: p.party_type, partyName: p.party_name}));
    db.auditLogs = cloudDb.auditLogs.map(l => ({...l, branchId: l.branch_id, dateStr: l.date_str, oldCash: l.old_cash, newCash: l.new_cash, oldBank: l.old_bank, newBank: l.new_bank}));

    if (db.companies.length === 0) {
      const cid = 'comp_demo';
      const demoCompany = { id: cid, name:'شركة النموذج التجارية', code:'DEMO', password:'1234', currency:'ر.س' };
      const demoBranch1 = { id: 'br_main', companyId: cid, name:'الفرع الرئيسي', code:'01', cashOpening:0, bankOpening:0 };
      const demoBranch2 = { id: 'br_jed', companyId: cid, name:'فرع جدة', code:'02', cashOpening:0, bankOpening:0 };
      const demoUser1 = { id: 'u1', companyId: cid, branchId:'br_main', name:'مدير النظام', username:'admin', password:'1234' };
      
      db.companies.push(demoCompany);
      db.branches.push(demoBranch1, demoBranch2);
      db.users.push(demoUser1);
      
      await saveToCloud('companies', [demoCompany]);
      await saveToCloud('branches', [demoBranch1, demoBranch2]);
      await saveToCloud('users', [demoUser1]);
    }
  } catch (error) {
    console.error("DB Error:", error);
    showError("تعذر الاتصال بقاعدة البيانات. تأكد من إعدادات Vercel و Neon. \n" + error.message);
  }
}

async function saveToCloud(table, dataArray) {
  try {
    await fetch('/api/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ table, data: dataArray })
    });
  } catch (error) {
    console.error("Save Error:", error);
    toast('حدث خطأ أثناء الحفظ في السحابة', 'err');
  }
}

async function deleteFromCloud(table, id) {
  try {
    await fetch('/api/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ table, action: 'delete', id })
    });
  } catch (error) {
    console.error("Delete Error:", error);
    toast('حدث خطأ أثناء الحذف', 'err');
  }
}

function currentCompany(){ return db.companies.find(function(c){ return c.id===session.companyId; }); }
function currentBranch(){ return db.branches.find(function(b){ return b.id===session.branchId; }); }
function currentUser(){ return db.users.find(function(u){ return u.id===session.userId; }); }

function branchData(){
  var bid = session.branchId;
  return {
    sales: db.sales.filter(function(x){ return x.branchId===bid; }),
    purchases: db.purchases.filter(function(x){ return x.branchId===bid; }),
    expenses: db.expenses.filter(function(x){ return x.branchId===bid; }),
    payments: db.payments.filter(function(x){ return x.branchId===bid; }),
    contacts: db.contacts.filter(function(x){ return x.branchId===bid; })
  };
}

function totals(){
  var d = branchData(), b = currentBranch() || { cashOpening:0, bankOpening:0 };
  var cash = num(b.cashOpening), bank = num(b.bankOpening);
  d.sales.forEach(function(x){ if(x.method === 'bank') bank += num(x.paid); else cash += num(x.paid); });
  d.purchases.forEach(function(x){ if(x.method === 'bank') bank -= num(x.paid); else cash -= num(x.paid); });
  d.expenses.forEach(function(x){ if(x.method === 'bank') bank -= num(x.amount); else cash -= num(x.amount); });
  d.payments.forEach(function(x){
    var val = num(x.amount);
    if(x.direction === 'in'){ if(x.method === 'bank') bank += val; else cash += val; } 
    else { if(x.method === 'bank') bank -= val; else cash -= val; }
  });
  return { cash: cash, bank: bank, totalLiquidity: cash + bank };
}

function logAction(action, entity, details, oldCash, newCash, oldBank, newBank) {
  var u = currentUser();
  var log = {
    id: uid(), branchId: session.branchId, timestamp: Date.now(),
    dateStr: new Date().toLocaleString('ar-EG', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }),
    user: u ? u.name : 'غير معروف', action: action, entity: entity, details: details,
    oldCash: oldCash, newCash: newCash, oldBank: oldBank, newBank: newBank
  };
  db.auditLogs.push(log);
  saveToCloud('audit_logs', db.auditLogs);
}

function contactStats(c){
  var d = branchData();
  if(c.type === 'customer'){
    var inv = d.sales.filter(function(s){ return s.customerId===c.id; });
    var total = sum(inv,'total'), paidUpfront = sum(inv,'paid');
    var later = sum(d.payments.filter(function(p){ return p.partyId===c.id && p.direction==='in'; }),'amount');
    return { total: total, paid: paidUpfront + later, balance: total - paidUpfront - later };
  }
  var inv2 = d.purchases.filter(function(s){ return s.supplierId===c.id; });
  var total2 = sum(inv2,'total'), paidUpfront2 = sum(inv2,'paid');
  var later2 = sum(d.payments.filter(function(p){ return p.partyId===c.id && p.direction==='out'; }),'amount');
  return { total: total2, paid: paidUpfront2 + later2, balance: total2 - paidUpfront2 - later2 };
}

function render(){
  if(session.companyId && !db.companies.some(function(c){ return c.id===session.companyId; })) resetSession();
  if(session.branchId){
    if(!db.branches.some(function(b){ return b.id===session.branchId; })){ session.branchId=null; session.userId=null; saveSession(); }
  }
  if(session.userId && !db.users.some(function(u){ return u.id===session.userId; })){ session.userId=null; saveSession(); }

  if(!session.companyId) return viewCompanyLogin();
  if(!session.branchId)  return viewBranchSelect();
  if(!session.userId)    return viewUserAuth();
  return viewApp();
}

// ---------------- الشاشات الأساسية ----------------
function viewCompanyLogin(){
  root.innerHTML =
    '<div class="auth-wrap"><div class="auth-card"><h1>📊 نظام حسابات الشركة</h1>' +
      '<form id="form-company-login" class="stack">' +
        '<label>رمز الشركة<input id="c-code" placeholder="مثال: DEMO" autocomplete="off" required></label>' +
        '<label>كلمة مرور الشركة<input id="c-pass" type="password" placeholder="••••" required></label>' +
        '<button class="btn primary" type="submit">دخول الشركة</button>' +
      '</form><div id="msg" class="msg"></div>' +
      
      '<details class="mt"><summary style="cursor:pointer;font-weight:700;color:var(--primary)">إنشاء حساب شركة جديدة</summary>' +
        '<form id="form-company-new" class="stack mt">' +
          '<label>اسم الشركة<input id="n-name" required></label>' +
          '<label>رمز الشركة (للدخول)<input id="n-code" placeholder="مثال: ABC" required></label>' +
          '<label>كلمة مرور الشركة<input id="n-pass" type="password" required></label>' +
          '<label>العملة<input id="n-cur" value="ر.س"></label>' +
          '<hr style="border:0;border-top:1px solid #eee;margin:10px 0">' +
          '<label>اسم مدير النظام (المستخدم)<input id="n-user" placeholder="مثال: أحمد" required></label>' +
          '<label>كلمة مرور المدير<input id="n-userpass" type="password" required></label>' +
          '<button class="btn" type="submit">إنشاء الشركة</button>' +
        '</form>' +
      '</details>' +
      '<p class="hint">تجربة سريعة: الرمز <b>DEMO</b> — كلمة المرور <b>1234</b></p>' +
    '</div></div>';

  $('#form-company-login').onsubmit = function(e){
    e.preventDefault();
    var code = $('#c-code').value.trim().toUpperCase(), pass = $('#c-pass').value;
    var c = db.companies.find(function(x){ return x.code.toUpperCase() === code; });
    if(!c || c.password !== pass) return flash('رمز الشركة أو كلمة المرور غير صحيحة');
    session = { companyId:c.id, branchId:null, userId:null }; saveSession(); render();
  };

  $('#form-company-new').onsubmit = async function(e){
    e.preventDefault();
    var name = $('#n-name').value.trim(), code = $('#n-code').value.trim().toUpperCase(), pass = $('#n-pass').value, cur = $('#n-cur').value.trim() || 'ر.س';
    var uName = $('#n-user').value.trim(), uPass = $('#n-userpass').value;
    
    if(!name || !code || !pass || !uName || !uPass) return flash('أكمل جميع الحقول');
    if(db.companies.some(function(c){ return c.code.toUpperCase() === code; })) return flash('رمز الشركة مستخدم مسبقًا');
    
    var newCompanyId = uid();
    var newBranchId = uid();
    var newUserId = uid();

    var newCompany = { id: newCompanyId, name: name, code: code, password: pass, currency: cur };
    var newBranch = { id: newBranchId, companyId: newCompanyId, name: 'الفرع الرئيسي', code: '01', cashOpening: 0, bankOpening: 0 };
    var newUser = { id: newUserId, companyId: newCompanyId, branchId: newBranchId, name: uName, username: uName, password: uPass };

    db.companies.push(newCompany);
    db.branches.push(newBranch);
    db.users.push(newUser);

    await saveToCloud('companies', [newCompany]);
    await saveToCloud('branches', [newBranch]);
    await saveToCloud('users', [newUser]);

    flash('تم إنشاء الشركة بنجاح — يمكنك الدخول الآن', 'ok');
    $('#c-code').value = code;
    $('#form-company-new').reset();
  };
}

function viewBranchSelect(){
  var c = currentCompany();
  var myBranches = db.branches.filter(function(b){ return b.companyId === c.id; });
  
  var cards = myBranches.map(function(b){
    return '<div class="branch-card" data-branch="'+b.id+'">' +
      '<button class="del-branch-btn no-print" data-delbranch="'+b.id+'" title="حذف الفرع">🗑️</button>' +
      '<span class="branch-icon">🏢</span><span class="branch-name">'+esc(b.name)+'</span><span class="muted small">رمز: '+esc(b.code)+'</span></div>';
  }).join('');
  
  root.innerHTML =
    '<div class="auth-wrap"><div class="auth-card wide">' +
      '<div class="topbar"><div><div style="font-weight:900;font-size:17px">'+esc(c.name)+'</div><div class="muted small">اختر الفرع</div></div><button class="btn ghost sm" id="btn-back-company">تغيير الشركة</button></div>' +
      '<div class="branch-grid">'+cards+'</div>' +
      
      '<details class="mt"><summary style="cursor:pointer;font-weight:700;color:var(--primary)">إضافة فرع جديد</summary>' +
        '<form id="form-branch-new" class="row mt">' +
          '<input id="b-name" placeholder="اسم الفرع" required style="flex:2;min-width:160px">' +
          '<input id="b-code" placeholder="رمز الفرع" required style="flex:1;min-width:100px">' +
          '<button class="btn" type="submit">إضافة</button>' +
        '</form>' +
      '</details><div id="msg" class="msg"></div>' +
    '</div></div>';
    
  root.querySelectorAll('.branch-card').forEach(function(card){ 
    card.onclick = function(e){ 
      if(e.target.closest('.del-branch-btn')) return;
      session.branchId = card.dataset.branch; session.userId = null; saveSession(); render(); 
    }; 
  });

  root.querySelectorAll('[data-delbranch]').forEach(function(btn){
    btn.onclick = async function(e){
      e.stopPropagation();
      if(!confirm('تأكيد حذف الفرع وكل بياناته (فواتير، مستخدمين)؟ لا يمكن التراجع.')) return;
      var bId = btn.dataset.delbranch;
      
      db.branches = db.branches.filter(b => b.id !== bId);
      await deleteFromCloud('branches', bId);
      // حذف مرتبطات أخرى (اختياري، لكن الأفضل مسح الذاكرة على الأقل)
      var relatedData = [
        { table: 'users', arr: db.users },
        { table: 'sales', arr: db.sales },
        { table: 'purchases', arr: db.purchases },
        { table: 'expenses', arr: db.expenses },
        { table: 'payments', arr: db.payments },
        { table: 'contacts', arr: db.contacts }
      ];
      for (let r of relatedData) {
        let toDelete = r.arr.filter(x => x.branchId === bId);
        for (let item of toDelete) { await deleteFromCloud(r.table, item.id); }
        db[r.table] = r.arr.filter(x => x.branchId !== bId);
      }
      
      toast('تم حذف الفرع'); render();
    };
  });

  $('#btn-back-company').onclick = function(){ session = { companyId:null, branchId:null, userId:null }; saveSession(); render(); };
  
  $('#form-branch-new').onsubmit = async function(e){
    e.preventDefault();
    var name = $('#b-name').value.trim(), code = $('#b-code').value.trim();
    if(!name || !code) return flash('أدخل اسم ورمز الفرع');
    if(myBranches.some(function(b){ return b.code === code; })) return flash('رمز الفرع مستخدم');
    
    var newB = { id: uid(), companyId: c.id, name: name, code: code, cashOpening: 0, bankOpening: 0 };
    db.branches.push(newB);
    await saveToCloud('branches', [newB]);
    toast('تم إضافة الفرع'); render();
  };
}

// ---------------- التقفيلة اليومية (تفصيلي) ----------------
function viewDailyClose(v){
  var date = ui.dailyDate;
  var b = currentBranch() || { cashOpening:0, bankOpening:0 };
  var openCash = num(b.cashOpening), openBank = num(b.bankOpening);

  // 1. حساب الرصيد قبل اليوم
  db.sales.forEach(function(x){ if(x.branchId === session.branchId && x.date < date) { if(x.method === 'bank') openBank += num(x.paid); else openCash += num(x.paid); }});
  db.purchases.forEach(function(x){ if(x.branchId === session.branchId && x.date < date) { if(x.method === 'bank') openBank -= num(x.paid); else openCash -= num(x.paid); }});
  db.expenses.forEach(function(x){ if(x.branchId === session.branchId && x.date < date) { if(x.method === 'bank') openBank -= num(x.amount); else openCash -= num(x.amount); }});
  db.payments.forEach(function(x){ if(x.branchId === session.branchId && x.date < date) { var val = num(x.amount); if(x.direction === 'in'){ if(x.method === 'bank') openBank += val; else openCash += val; } else { if(x.method === 'bank') openBank -= val; else openCash -= val; } }});

  // 2. جلب حركات اليوم بالتفصيل
  var cashOps = [], bankOps = [];
  var tsBase = new Date(date + 'T00:00:00').getTime();
  
  db.sales.forEach(function(x){ 
    if(x.branchId === session.branchId && x.date === date) { 
      var op = { ts: tsBase + Math.random(), type: 'بيع', name: x.customerName, in: num(x.paid), out: 0 };
      if(x.method === 'bank') bankOps.push(op); else cashOps.push(op);
    }
  });
  db.purchases.forEach(function(x){ 
    if(x.branchId === session.branchId && x.date === date) { 
      var op = { ts: tsBase + Math.random(), type: 'شراء', name: x.supplierName, in: 0, out: num(x.paid) };
      if(x.method === 'bank') bankOps.push(op); else cashOps.push(op);
    }
  });
  db.expenses.forEach(function(x){ 
    if(x.branchId === session.branchId && x.date === date) { 
      var op = { ts: tsBase + Math.random(), type: 'مصروف', name: x.category, in: 0, out: num(x.amount) };
      if(x.method === 'bank') bankOps.push(op); else cashOps.push(op);
    }
  });
  db.payments.forEach(function(x){ 
    if(x.branchId === session.branchId && x.date === date) { 
      var op = { ts: tsBase + Math.random(), type: x.direction === 'in' ? 'قبض' : 'صرف', name: x.partyName, in: x.direction === 'in' ? num(x.amount) : 0, out: x.direction === 'out' ? num(x.amount) : 0 };
      if(x.method === 'bank') bankOps.push(op); else cashOps.push(op);
    }
  });

  cashOps.sort(function(a,b){ return a.ts - b.ts; });
  bankOps.sort(function(a,b){ return a.ts - b.ts; });

  // 3. بناء الجدول
  function buildTable(ops, startBal) {
    if(ops.length === 0) return '<p class="muted mt">لا توجد حركات في هذا اليوم.</p>';
    var running = startBal;
    var rows = ops.map(function(o){
      running += (o.in - o.out);
      return '<tr>' +
        '<td><span class="badge '+(o.in>0?'green':'red')+'">'+o.type+'</span></td>' +
        '<td>'+esc(o.name || '-')+'</td>' +
        '<td class="num" style="color:var(--ok)">'+(o.in ? money(o.in) : '-')+'</td>' +
        '<td class="num" style="color:var(--danger)">'+(o.out ? money(o.out) : '-')+'</td>' +
        '<td class="num" style="font-weight:bold">'+money(running)+'</td>' +
      '</tr>';
    }).join('');
    
    return '<div class="tbl-wrap mt"><table class="tbl"><thead><tr><th>العملية</th><th>البيان (الطرف)</th><th class="num">مدين (+)</th><th class="num">دائن (-)</th><th class="num">الرصيد المدور</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  v.innerHTML = 
    printHeader() +
    '<div class="card no-print">' +
      '<h3>اختر التاريخ لعرض الإغلاق اليومي التفصيلي</h3>' +
      '<div class="row">' +
        '<input type="date" id="daily-date" value="' + date + '" style="max-width:200px">' +
        '<button class="btn primary" id="btn-daily-view">عرض</button>' +
        '<button class="btn" onclick="window.print()">🖨️ طباعة</button>' +
      '</div>' +
    '</div>' +
    '<div class="print-only"><h3>تقرير الإغلاق اليومي التفصيلي ليوم: ' + date + '</h3></div>' +
    
    '<div class="grid two">' +
      '<div class="card">' +
        '<h3 style="color:var(--ok)">حركة الخزينة (النقدي)</h3>' +
        '<p>الرصيد المدور من الأمس: <b>' + money(openCash) + '</b></p>' +
        buildTable(cashOps, openCash) +
      '</div>' +
      '<div class="card">' +
        '<h3 style="color:#6b3fd4">حركة البنك</h3>' +
        '<p>الرصيد المدور من الأمس: <b>' + money(openBank) + '</b></p>' +
        buildTable(bankOps, openBank) +
      '</div>' +
    '</div>';

  $('#btn-daily-view').onclick = function(){
    ui.dailyDate = $('#daily-date').value;
    viewDailyClose(v);
  };
}

// ---------------- التقارير (أسبوعي وشهري) ----------------
function viewReports(v){
  var d = branchData();
  var start = ui.rStart, end = ui.rEnd;
  
  if(ui.rType === 'daily'){ start = ui.rDate; end = ui.rDate; }
  if(ui.rType === 'weekly'){
    var parts = ui.rDate.split('-');
    var dt = new Date(parts[0], parts[1]-1, parts[2]);
    var day = dt.getDay(); 
    var diff = dt.getDate() - day + (day === 6 ? 0 : -6);
    var sat = new Date(dt.setDate(diff));
    start = isoLocal(sat);
    var thu = new Date(sat); thu.setDate(thu.getDate() + 5);
    end = isoLocal(thu);
  }
  if(ui.rType === 'monthly'){
    var partsM = ui.rMonth.split('-');
    var y = partsM[0], m = partsM[1];
    start = y + '-' + m + '-01';
    var lastDay = new Date(y, m, 0).getDate();
    end = y + '-' + m + '-' + (lastDay < 10 ? '0'+lastDay : lastDay);
  }

  var controls = '<div class="form-grid no-print">' +
      '<label>نوع التقرير<select id="r-type">' +
        '<option value="daily" '+(ui.rType==='daily'?'selected':'')+'>يومي</option>' +
        '<option value="weekly" '+(ui.rType==='weekly'?'selected':'')+'>أسبوعي (السبت إلى الخميس)</option>' +
        '<option value="monthly" '+(ui.rType==='monthly'?'selected':'')+'>شهري (بالأسابيع)</option>' +
        '<option value="custom" '+(ui.rType==='custom'?'selected':'')+'>مخصص</option>' +
      '</select></label>';
  if(ui.rType === 'daily') controls += '<label>التاريخ<input type="date" id="r-date" value="'+ui.rDate+'"></label>';
  if(ui.rType === 'weekly') controls += '<label>تاريخ يوم السبت<input type="date" id="r-date" value="'+ui.rDate+'"></label>';
  if(ui.rType === 'monthly') controls += '<label>الشهر<input type="month" id="r-month" value="'+ui.rMonth+'"></label>';
  if(ui.rType === 'custom') controls += '<label>من<input type="date" id="r-start" value="'+ui.rStart+'"></label><label>إلى<input type="date" id="r-end" value="'+ui.rEnd+'"></label>';
  
  controls += '<div class="row" style="gap:8px"><button class="btn primary" id="r-apply" type="button">عرض التقرير</button><button class="btn" id="r-print" type="button">طباعة</button></div></div>';

  var periodLabel = (ui.rType === 'daily') ? 'يوم ' + start :
                    (ui.rType === 'weekly') ? 'الأسبوع من السبت ' + start + ' إلى الخميس ' + end :
                    (ui.rType === 'monthly') ? 'شهر ' + ui.rMonth : 'الفترة من ' + start + ' إلى ' + end;

  var b = currentBranch() || { cashOpening:0, bankOpening:0 };
  var prevCash = num(b.cashOpening), prevBank = num(b.bankOpening);
  
  // حساب الرصيد قبل بداية الفترة المحددة
  db.sales.forEach(function(x){ if(x.branchId === session.branchId && x.date < start) { if(x.method === 'bank') prevBank += num(x.paid); else prevCash += num(x.paid); }});
  db.purchases.forEach(function(x){ if(x.branchId === session.branchId && x.date < start) { if(x.method === 'bank') prevBank -= num(x.paid); else prevCash -= num(x.paid); }});
  db.expenses.forEach(function(x){ if(x.branchId === session.branchId && x.date < start) { if(x.method === 'bank') prevBank -= num(x.amount); else prevCash -= num(x.amount); }});
  db.payments.forEach(function(x){ if(x.branchId === session.branchId && x.date < start) { var val = num(x.amount); if(x.direction === 'in'){ if(x.method === 'bank') prevBank += val; else prevCash += val; } else { if(x.method === 'bank') prevBank -= val; else prevCash -= val; } }});

  // تجهيز فترات الأسابيع (للتقرير الأسبوعي والشهري)
  var periods = [];
  if (ui.rType === 'weekly') {
    periods.push({ start: start, end: end, label: 'الأسبوع من ' + start + ' إلى ' + end });
  } else if (ui.rType === 'monthly') {
    var cur = new Date(start + 'T00:00:00');
    var endD = new Date(end + 'T00:00:00');
    var weekNum = 1;
    while(cur <= endD) {
      var wEnd = new Date(cur);
      wEnd.setDate(wEnd.getDate() + 6); // 7 أيام
      if(wEnd > endD) wEnd = endD;
      periods.push({ start: isoLocal(cur), end: isoLocal(wEnd), label: 'الأسبوع ' + weekNum + ' (' + isoLocal(cur) + ' إلى ' + isoLocal(wEnd) + ')' });
      cur.setDate(cur.getDate() + 7);
      weekNum++;
    }
  } else if (ui.rType === 'custom') {
    // للمخصص نعرض الفترة كأسبوع واحد
    periods.push({ start: start, end: end, label: 'الفترة المحددة' });
  }

  if (periods.length > 0) {
    var runningCash = prevCash;
    var runningBank = prevBank;
    var totalInCash=0, totalOutCash=0, totalInBank=0, totalOutBank=0;
    var rowsHtml = '';

    periods.forEach(function(p) {
      var inCash=0, outCash=0, inBank=0, outBank=0;
      
      db.sales.forEach(function(x){ if(x.branchId === session.branchId && x.date >= p.start && x.date <= p.end) { if(x.method === 'bank') inBank += num(x.paid); else inCash += num(x.paid); }});
      db.payments.forEach(function(x){ if(x.branchId === session.branchId && x.date >= p.start && x.date <= p.end && x.direction === 'in') { if(x.method === 'bank') inBank += num(x.amount); else inCash += num(x.amount); }});
      
      db.purchases.forEach(function(x){ if(x.branchId === session.branchId && x.date >= p.start && x.date <= p.end) { if(x.method === 'bank') outBank += num(x.paid); else outCash += num(x.paid); }});
      db.expenses.forEach(function(x){ if(x.branchId === session.branchId && x.date >= p.start && x.date <= p.end) { if(x.method === 'bank') outBank += num(x.amount); else outCash += num(x.amount); }});
      db.payments.forEach(function(x){ if(x.branchId === session.branchId && x.date >= p.start && x.date <= p.end && x.direction === 'out') { if(x.method === 'bank') outBank += num(x.amount); else outCash += num(x.amount); }});

      totalInCash += inCash; totalOutCash += outCash;
      totalInBank += inBank; totalOutBank += outBank;

          '<td class="num" style="color:var(--ok)">' + (inBank ? money(inBank) : '-') + '</td>' +
          '<td class="num" style="color:var(--danger)">' + (outBank ? money(outBank) : '-') + '</td>' +
          '<td class="num" style="'+balBankStyle+'">' + money(runningBank) + '</td>' +
      '</tr>';

    var party = d.contacts.find(function(c){ return c.id === partyId; });
    var oldT = totals();
    db.payments.push({ id: uid(), branchId: session.branchId, date: $('#p-date').value, direction: typeSel.value, partyType: typeSel.value === 'in' ? 'customer' : 'supplier', partyId: partyId, partyName: party ? party.name : '', amount: amount, method: method, note: note });
    saveToCloud('payments', db.payments);
    var newT = totals();
    logAction('إضافة', (typeSel.value === 'in' ? 'سند قبض' : 'سند صرف'), 'الطرف: ' + (party ? party.name : '') + ' | المبلغ: ' + amount + (note?' | ملاحظة: '+note:''), oldT.cash, newT.cash, oldT.bank, newT.bank);
    toast('تمت الإضافة'); viewPayments(v);
  };
  bindDeletes(v);
}

function viewDebts(v){
  var d = branchData();
  var customers = d.contacts.filter(function(c){ return c.type === 'customer'; }).map(function(c){ return { c:c, s:contactStats(c) }; }).filter(function(x){ return x.s.balance !== 0; });
  var suppliers = d.contacts.filter(function(c){ return c.type === 'supplier'; }).map(function(c){ return { c:c, s:contactStats(c) }; }).filter(function(x){ return x.s.balance !== 0; });
  
  function tbl(list, label){
    if(!list.length) return '<p class="muted">لا توجد ديون على '+label+'.</p>';
    return '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>الاسم</th><th class="num">إجمالي التعامل</th><th class="num">المدفوع</th><th class="num">المتبقي</th></tr></thead><tbody>' +
      list.map(function(x){ return '<tr><td>'+esc(x.c.name)+'</td><td class="num">'+money(x.s.total)+'</td><td class="num">'+money(x.s.paid)+'</td><td class="num" style="font-weight:900;color:'+(x.s.balance>0?'var(--warn)':'var(--ok)')+'">'+money(x.s.balance)+'</td></tr>'; }).join('') + '</tbody></table></div>';
  }

  v.innerHTML = 
    printHeader() +
    '<div class="card no-print"><button class="btn primary" onclick="window.print()">🖨️ طباعة كشف الديون</button></div>' +
    '<div class="card"><h3>ديون العملاء (لنا)</h3>'+tbl(customers, 'العملاء')+'</div>' +
    '<div class="card"><h3>ديون الموردين (علينا)</h3>'+tbl(suppliers, 'الموردين')+'</div>';
}

function viewLedger(v){
  var logs = db.auditLogs.filter(function(l){ return l.branchId === session.branchId; }).sort(function(a,b){ return b.timestamp - a.timestamp; });
  
  var rowsHtml = logs.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
      '<th>التاريخ والوقت</th><th>المستخدم</th><th>العملية</th><th>التفاصيل والملاحظات</th><th class="num">التغيير في الخزينة</th><th class="num">التغيير في البنك</th>' +
      '</tr></thead><tbody>' +
      logs.map(function(l){
        var cashDiff = num(l.newCash) - num(l.oldCash);
        var bankDiff = num(l.newBank) - num(l.oldBank);
        
        var cashHtml = cashDiff === 0 ? '<span class="muted">-</span>' : 
                       cashDiff > 0 ? '<span style="color:var(--ok);font-weight:bold">+ ' + money(cashDiff) + '</span>' : 
                       '<span style="color:var(--danger);font-weight:bold">- ' + money(Math.abs(cashDiff)) + '</span>';
                       
        var bankHtml = bankDiff === 0 ? '<span class="muted">-</span>' : 
                       bankDiff > 0 ? '<span style="color:var(--ok);font-weight:bold">+ ' + money(bankDiff) + '</span>' : 
                       '<span style="color:var(--danger);font-weight:bold">- ' + money(Math.abs(bankDiff)) + '</span>';

        var actionBadge = l.action==='إضافة' ? 'green' : l.action==='حذف' ? 'red' : 'orange';

        return '<tr>' +
          '<td class="small" style="white-space:nowrap">' + l.dateStr + '</td>' +
          '<td><b>' + esc(l.user) + '</b></td>' +
          '<td><span class="badge ' + actionBadge + '">' + l.action + '</span></td>' +
          '<td>' + esc(l.entity) + '<br><span class="muted small">' + esc(l.details) + '</span></td>' +
          '<td class="num">' + cashHtml + '</td>' +
          '<td class="num">' + bankHtml + '</td>' +
        '</tr>';
      }).join('') + '</tbody></table></div>' : '<p class="muted">سجل التدقيق فارغ حتى الآن.</p>';

  v.innerHTML = '<div class="card"><h3>سجل الحركات والتدقيق</h3><p class="muted small">يعرض هذا السجل: من قام بالعملية، ومتى، والتفاصيل والملاحظات، ومقدار الزيادة أو النقصان في الخزينة والبنك.</p>' + rowsHtml + '</div>';
}

function viewContacts(v){
  var d = branchData(), rows = d.contacts;
  var rowsHtml = rows.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>الاسم</th><th>النوع</th><th class="num">الرصيد</th><th></th></tr></thead><tbody>' +
      rows.map(function(c){
        var s = contactStats(c);
        return '<tr><td>'+esc(c.name)+'</td><td><span class="badge '+(c.type==='customer'?'blue':'purple')+'">'+(c.type==='customer'?'عميل':'مورد')+'</span></td><td class="num" style="color:'+(s.balance>0?'var(--warn)':'var(--ok)')+'">'+money(s.balance)+'</td><td><button class="btn danger sm no-print" data-del="contacts" data-id="'+c.id+'">حذف</button></td></tr>';
      }).join('') + '</tbody></table></div>' : '<p class="muted">القائمة فارغة.</p>';

  v.innerHTML = '<div class="card no-print"><h3>إضافة عميل / مورد</h3><form id="f-contact" class="form-grid">' +
        '<label>النوع<select id="c-type"><option value="customer">عميل</option><option value="supplier">مورد</option></select></label>' +
        '<label>الاسم<input id="c-name" required></label><div><button class="btn primary" type="submit">إضافة</button></div></form></div>' +
      '<div class="card"><h3>القائمة ('+rows.length+')</h3>' + rowsHtml + '</div>';

  $('#f-contact').onsubmit = function(e){
    e.preventDefault();
    var name = $('#c-name').value.trim(), type = $('#c-type').value;
    if(!name) return toast('أدخل الاسم', 'err');
    db.contacts.push({ id: uid(), companyId: session.companyId, branchId: session.branchId, type: type, name: name });
    saveToCloud('contacts', db.contacts);
    logAction('إضافة', (type === 'customer' ? 'عميل' : 'مورد'), 'الاسم: ' + name, null, null, null, null);
    toast('تمت الإضافة'); viewContacts(v);
  };
  bindDeletes(v);
}

function bindDeletes(v){
  v.querySelectorAll('[data-del]').forEach(function(btn){
    btn.onclick = async function(){
      if(!confirm('تأكيد الحذف؟ سيتم تسجيل العملية.')) return;
      var col = btn.dataset.del, id = btn.dataset.id;
      var item = db[col].find(function(x){ return x.id === id; });
      if(!item) return;
      var oldT = totals();
      db[col] = db[col].filter(function(x){ return x.id !== id; });
      await deleteFromCloud(col, id);
      var newT = totals();
      var entityName = col === 'sales' ? 'فاتورة بيع' : col === 'purchases' ? 'فاتورة شراء' : col === 'expenses' ? 'مصروف' : col === 'payments' ? 'دفعة' : 'طرف';
      var desc = 'حذف سجل سابق';
      if(col === 'sales') desc = 'عميل: '+(item.customerName||'نقدي')+' | الإجمالي: '+item.total;
      else if(col === 'purchases') desc = 'مورد: '+(item.supplierName||'نقدي')+' | الإجمالي: '+item.total;
      else if(col === 'expenses') desc = item.category+' | المبلغ: '+item.amount;
      else if(col === 'payments') desc = item.partyName+' | المبلغ: '+item.amount;
      else if(col === 'contacts') desc = item.name;
      
      if(item.note) desc += ' | ملاحظة: ' + item.note;
      
      logAction('حذف', entityName, desc, oldT.cash, newT.cash, oldT.bank, newT.bank);
      toast('تم الحذف'); renderView();
    };
  });
}

async function startApp() {
  await loadDBFromCloud();
  document.getElementById('loading-screen').style.display = 'none';
  render();
}

startApp();

} catch(err) { showError((err && err.stack) || (err && err.message) || String(err)); }
})();
</script>
</body>
</html>
